[pytest]
python_files = *_test.py *_integration_test.py *_e2e_test.py
python_classes = Test*
python_functions = test_*
testpaths = src tools
norecursedirs = deps node_modules
markers =
    integration: requires deps/pokemon-showdown Node bridge (no live server needed)
    e2e: requires a running Showdown server on localhost:8000
asyncio_mode = auto
