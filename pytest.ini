[pytest]
python_files = *_test.py *_integration_test.py *_e2e_test.py
python_classes = Test*
python_functions = test_*
testpaths = src tools
norecursedirs = deps node_modules
markers =
    integration: requires an out-of-process dependency but no live server — usually the
        deps/pokemon-showdown Node bridge; the two *_render_integration_test.py files instead
        need a headless browser, and skip (naming which) when there is none
    e2e: requires a running Showdown server on localhost:8000
asyncio_mode = auto
