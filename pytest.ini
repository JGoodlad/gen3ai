[pytest]
python_files = *_test.py *_integration_test.py *_e2e_test.py
python_classes = Test*
python_functions = test_*
testpaths = src tools
norecursedirs = deps node_modules
# TWO ORTHOGONAL AXES, and keeping them apart is the whole design.
#
#   CAPABILITY — what the test NEEDS, i.e. whether it CAN run here at all:
#       (unmarked) = pure in-process | integration | sim | browser | e2e
#   COST — how LONG it takes, i.e. whether it should run routinely:
#       slow
#
# Collapsing these into one axis is what the old single `integration` marker did, and it failed in
# both directions: it forced you to pay for the minutes-long rust/node parity to check a teambuilder
# change, while the routine gate `-m "not integration and not e2e"` excluded the six-battle
# obs-golden linchpin — which then rode main RED three separate times (see that test's docstring).
# The obs-golden test is battle-backed AND cheap (~5 s); the rust/node parity is battle-backed and
# takes minutes. Cost tracks battle COUNT, not the fact that a test battles at all, so `sim` cannot
# be the thing that decides what runs routinely. `slow` is.
#
# THE DEFAULT GATE IS THEREFORE `-m "not slow and not e2e"` — everything cheap, whatever it needs.
#
# A tier is DECLARED, never inferred: cost arrives transitively (the obs-golden test plays its six
# battles through a helper it imports), so neither a filename nor an import graph can classify it —
# both were measured wrong. The root conftest enforces the other direction: an unmarked test that
# overruns the default-tier budget fails the run and is told which marker to take.
markers =
    integration: needs an out-of-process dependency but plays NO battles and drives no browser —
        data files, a Node module import, a packed-team decode. Seconds.
    sim: plays real Pokemon battles in-process through the deps/pokemon-showdown bridge (no live
        server). Says what it NEEDS, not what it costs — pair with `slow` when it takes minutes.
    browser: needs a headless browser (chrome). Skips, naming which, when there is none.
    e2e: requires a running Showdown server on localhost:8000
    slow: minutes, not seconds — EXCLUDED from the routine gate and run deliberately (before a
        ship, in CI, or when touching what it covers). The one marker that decides routine cost.
    benchmark: a MEASUREMENT, not a pass/fail gate — never scale its bounds, warn instead
asyncio_mode = auto
