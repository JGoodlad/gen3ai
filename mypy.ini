# Static type checking — SCOPED to src/agents/model/.
#
# Run:  export PYTHONPATH=$PYTHONPATH:src
#       python3 -m mypy src/agents/model     # must be ZERO errors
#
# Scope note: only the model package is CHECKED. `follow_imports = silent` lets
# mypy read the rest of the tree for types without reporting its errors, so this
# config can be tightened here without waiting on the other packages.
[mypy]
python_version = 3.11
mypy_path = src
namespace_packages = True
explicit_package_bases = True
files = src/agents/model
follow_imports = silent

# Excluded:
#   *_test.py            — tests are unchecked this round.
#   extractor_arch.py    — GENERATED (build_arch_viewer / flag_registry emit it), so a
#                          hand annotation would be overwritten by the next regeneration.
#   feature_coverage/    — the coverage probes are all `*_test.py`; `_support.py` is their
#                          fixture module and belongs to the same (unchecked) tier.
exclude = (?x)(_test\.py$|/extractor_arch\.py$|/feature_coverage/)

# torch ships stubs; gymnasium / sb3 / numpy-adjacent third parties do not.
ignore_missing_imports = True

# --- strictness (the strongest the package can satisfy today) ---
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unused_configs = True
# NOT enabled: disallow_any_generics / disallow_untyped_calls / strict — both
# would fire mostly on untyped third-party (SB3, gymnasium) boundaries where a
# targeted `type: ignore` beats a wrong annotation.
