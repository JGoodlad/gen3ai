# Static type checking — SCOPED to src/agents/model/ and src/agents/observation/.
#
# Run:  python3 -m mypy                      # must be ZERO errors (scope from `files` below)
#       (in a linked worktree, first: export PYTHONPATH=$PYTHONPATH:src)
#
# Scope note: only the packages in `files` are CHECKED. `follow_imports = silent`
# lets mypy read the rest of the tree for types without reporting its errors, so
# this config can be tightened here without waiting on the other packages. The
# two checked packages share ONE strictness tier — widening the scope must never
# be paid for by loosening a setting, or the package already at zero silently
# loses coverage.
[mypy]
python_version = 3.11
mypy_path = src
namespace_packages = True
explicit_package_bases = True
files = src/agents/model, src/agents/observation
follow_imports = silent

# Excluded:
#   *_test.py            — tests are unchecked this round. In `observation/` this also
#                          covers `alignment_test.py`, which is a test despite the name
#                          not ending in a subsystem word.
#   extractor_arch.py    — GENERATED (build_arch_viewer / flag_registry emit it), so a
#                          hand annotation would be overwritten by the next regeneration.
#   feature_coverage/    — the coverage probes are all `*_test.py`; `_support.py` is their
#                          fixture module and belongs to the same (unchecked) tier.
#   *_benchmark.py / *_fuzz_test.py — run-directly scripts, same unchecked tier as tests.
#                          `observation/` currently holds none (benchmarks live in
#                          `training/` so they do not shadow a stdlib name), but the
#                          pattern is declared so a new one lands in the right tier.
exclude = (?x)(_test\.py$|_benchmark\.py$|/extractor_arch\.py$|/feature_coverage/)

# torch ships stubs; gymnasium / sb3 / numpy-adjacent third parties do not.
ignore_missing_imports = True

# --- strictness (the strongest the package can satisfy today) ---
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unused_configs = True
# NOT enabled: disallow_any_generics / disallow_untyped_calls / strict — both
# would fire mostly on untyped third-party (SB3, gymnasium) boundaries where a
# targeted `type: ignore` beats a wrong annotation.
