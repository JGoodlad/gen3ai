# =====================================================================================
# THE ENV (owner, 2026-09-30: "go ahead with moving to 2.8") — `gen3ai_torch28`, torch 2.8. The
# DEFAULT interpreter for every new run, gate and tool, and the env scripts/bootstrap.sh manages
# (keyed by THIS file's hash). environment.yml (`gen3ai_stable`, torch 2.5.1+cu121) is LEGACY and
# FROZEN: kept byte-for-byte so a run trained on it resumes on it (the launcher selects it from the
# run's recorded torch — src/main/launcher/torch_runtime.py); never edit it, never update that env.
#
# History (Lane K1, 2026-09-28): built on this box as `conda create --clone gen3ai_stable -n
# gen3ai_torch28` + `pip install --index-url https://download.pytorch.org/whl/cu126
# torch==2.8.0+cu126 torchvision==0.23.0+cu126 torchaudio==2.8.0+cu126` (which pulled triton
# 3.4.0, sympy 1.14.0 and the cu126 nvidia wheels below; `pip check` clean). It was a SEPARATE
# file because bootstrap then re-applied environment.yml to gen3ai_stable on any hash change.
# The 2.5.1-keyed branches still in the code (the trunk split in team_transformer.py, the 2.5.1
# rows in compile_control.py) serve legacy resumes only; see designs/training/compile_flags.md
# "Lane K1". To build it elsewhere: `conda env create -f environment_torch28.yml`.
# =====================================================================================
name: gen3ai_torch28
channels:
  - nvidia/label/cuda-12.6.3
  - defaults
dependencies:
  - python=3.11.15
  - pip=26.0.1
  # ------------------------------------------------------------------------------------
  # M5 T2 (owner, 2026-09-29): the CUDA 12.6 HEADERS AOTInductor's C++ build includes
  # (`<nv/target>` from CCCL, `crt/host_defines.h`, `cuda_runtime_api.h` + libcudart for the
  # link). THIS ENV ONLY — never gen3ai_stable, never system-wide. Headers only: no nvcc (the
  # nvidia channel's cuda-nvcc drags in a gcc toolchain; Triton brings its own ptxas). They land
  # under $CONDA_PREFIX/targets/x86_64-linux, which `agents.inference.service.aot.cuda_home()`
  # uses as CUDA_HOME. Installed with
  #   conda install -n gen3ai_torch28 -c nvidia/label/cuda-12.6.3 -c defaults \
  #       cuda-cccl=12.6.77 cuda-cudart-dev=12.6.77 cuda-crt-dev_linux-64=12.6.85
  # which also pulled cuda-cudart(-static)(_linux-64) 12.6.77, cuda-cccl_linux-64 12.6.77,
  # cuda-version 12.6 and the libstdcxx-ng 15.2.0 metapackage (the env's libstdcxx is already
  # 15.2.0). After it: `pip check` clean, torch 2.8.0+cu126 CUDA matmul OK.
  - cuda-cccl=12.6.77
  - cuda-cudart-dev=12.6.77
  - cuda-crt-dev_linux-64=12.6.85
  - pip:
      # ------------------------------------------------------------------------------------
      # THE PYTORCH WHEEL INDEX. `torch==2.8.0+cu126` (and torchaudio/torchvision) are
      # LOCAL-VERSION builds — the `+cu121` suffix — and local versions are NOT PUBLISHED ON
      # PyPI. Without this line `conda env create -f environment.yml` fails outright on ANY
      # fresh machine at the very first step, with
      #
      #     ERROR: Could not find a version that satisfies the requirement torch==2.8.0+cu126
      #
      # (verified 2026-08-22: PyPI offers 2.5.1, never 2.5.1+cu121 — the same holds for +cu126). conda hands this pip
      # block to `pip install -r`, and a requirements file honours pip flags as lines — so the
      # flag belongs here, not in a README someone has to read first.
      #
      # `--extra-index-url` (not `--index-url`): PyPI stays primary and only the four torch
      # wheels resolve here. Do not "tidy" it away; it is the fix for a reproducibility bug,
      # not a preference.
      #
      # CPU-ONLY MACHINES: nothing here is CUDA-gated at import time, but this file installs
      # ~2 GB of `nvidia-*-cu12` wheels a CPU box will never use. To build a CPU environment,
      # copy this file and (a) point this line at https://download.pytorch.org/whl/cpu,
      # (b) drop the `+cu126` local-version suffixes and the `triton` pin, (c) delete the
      # fourteen `nvidia-*-cu12` lines. Everything else — training on `--device cpu`, the whole
      # test suite, the prober — works unchanged. We ship no such file because nobody here
      # runs one; it is documented rather than engineered.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      # ------------------------------------------------------------------------------------
      - absl-py==2.4.0
      - beautifulsoup4==4.14.3
      - certifi==2026.4.22
      - charset-normalizer==3.4.7
      - cloudpickle==3.1.2
      - farama-notifications==0.0.6
      # fastapi + uvicorn + httpx + python-multipart (and their transitive deps annotated-doc,
      # annotated-types, anyio, click, h11, httpcore, pydantic, pydantic-core, starlette,
      # typing-inspection) serve the prober's web views — src/main/prober/web/. httpx is not
      # optional: it is what starlette's TestClient runs on, so the web unit tests need it.
      # python-multipart backs the login form's `Form(...)` fields.
      - fastapi==0.141.1
      - filelock==3.25.2
      - fsspec==2026.2.0
      - grpcio==1.80.0
      - gymnasium==1.2.3
      - httpx==0.28.1
      - idna==3.14
      - iniconfig==2.3.0
      - jinja2==3.1.6
      - lxml==6.1.0
      - markdown==3.10.2
      - markupsafe==3.0.3
      - matplotlib==3.10.9
      - mpmath==1.3.0
      # The two STATIC gates in the routine suite (`src/agents/model/mypy_gate_test.py`,
      # `src/ruff_gate_test.py`) shell out to these. They are test-suite dependencies, not
      # optional dev conveniences: without them installed those gates FAIL rather than skip,
      # because a linter that silently opts out reads green while enforcing nothing.
      - mypy==2.3.1
      - networkx==3.6.1
      - numpy==2.4.3
      - nvidia-cublas-cu12==12.6.4.1
      - nvidia-cuda-cupti-cu12==12.6.80
      - nvidia-cuda-nvrtc-cu12==12.6.77
      - nvidia-cuda-runtime-cu12==12.6.77
      - nvidia-cudnn-cu12==9.10.2.21
      - nvidia-cufft-cu12==11.3.0.4
      - nvidia-cufile-cu12==1.11.1.6
      - nvidia-curand-cu12==10.3.7.77
      - nvidia-cusolver-cu12==11.7.1.2
      - nvidia-cusparse-cu12==12.5.4.2
      - nvidia-cusparselt-cu12==0.7.1
      - nvidia-nccl-cu12==2.27.3
      - nvidia-nvjitlink-cu12==12.6.85
      - nvidia-nvtx-cu12==12.6.77
      - orjson==3.11.9
      - pandas==3.0.2
      - pettingzoo==1.26.1
      - pillow==12.1.1
      - pluggy==1.6.0
      # ------------------------------------------------------------------------------------
      # DELIBERATELY ABSENT — do not re-add either of these.
      #
      # `poke-env` (was pinned at 0.15.0 from PyPI). This repo VENDORS A FORK at `src/poke_env/`
      # and that fork is authoritative — it is 57 modules to upstream 0.15.0's 45, and the
      # battle layer depends on the additions. Installing the PyPI package alongside it creates
      # a SILENT SHADOWING HAZARD: two importable `poke_env` packages, and which one wins is
      # decided by sys.path order. It works today only because PYTHONPATH outranks
      # site-packages. Under a `pip install -e .` (the packaging phase that follows this one)
      # the editable `.pth` lands AFTER site-packages, so UPSTREAM WOULD SILENTLY WIN and the
      # battle layer would quietly run on unforked code — no error, no warning, wrong results.
      # Proved by experiment in both directions, 2026-08-22. Nothing in the environment
      # declares poke-env as a dependency (every distribution's `requires` was scanned), so
      # removing it costs nothing. `src/poke_env_fork_gate_test.py` is the permanent guard.
      #
      # `asyncio` (was pinned at 4.0.0). PyPI's own description: "Deprecated backport of the
      # asyncio module; use the stdlib package instead." Python 3.11 ships asyncio in the
      # standard library. The backport is at best inert and at worst a shadowing hazard of the
      # same shape as the one above.
      # ------------------------------------------------------------------------------------
      - protobuf==7.34.1
      - pygments==2.20.0
