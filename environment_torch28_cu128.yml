# =====================================================================================
# THE CUDA 12.8 TWIN OF `environment_torch28.yml` — env `gen3ai_torch28_cu128` (owner, 2026-10-12:
# "PyTorch update"). SAME package versions as `gen3ai_torch28` (torch 2.8.0, triton 3.4.0, every other pin
# identical), except torch / torchvision / torchaudio at their +cu128 builds, the nvidia-*-cu12 runtime wheels
# those builds pin, and the conda CUDA header packages (12.8, not 12.6).
#
# WHY IT EXISTS. torch 2.8.0+cu126's arch list stops at sm_90: it has NO kernels for Blackwell (sm_120: the
# RTX 5090 / 5070 Ti). The +cu128 wheels carry sm_70 ... sm_90, sm_100, sm_120, AND sm_86 (our RTX 3080 Ti), so
# one cu128 env runs on both. The multi-card cloud benchmark (designs/ops/cloud_gpu_benchmark.md) needs the
# local card measured on BOTH builds to separate "the card" from "the CUDA build".
#
# WHEN TO USE IT. Only where a run or a measurement must be on cu128: the cloud benchmark, a Blackwell
# card, the local cu126-vs-cu128 baseline. `gen3ai_torch28` stays THE DEFAULT; the default switches at a clean
# EXPERIMENT BOUNDARY (never mid-experiment — a run records its torch build, and the launcher refuses to resume
# it under another build without --allow-torch-switch). Selecting it: `GEN3AI_PYTHON=<this env>/bin/python3`.
#
# BUILD (a fresh env cannot disturb anything that uses another env; never `conda env update` the SHARED
# gen3ai_torch28 to get here):   conda env create -f environment_torch28_cu128.yml
#   or: ./scripts/bootstrap.sh --variant cu128 --skip-rust
# then, FROM THE MAIN CHECKOUT only, `pip install -e . --no-deps --no-build-isolation` with this env's pip
# (bootstrap does it there; a worktree must not — the editable install records one absolute path).
#
# THIS FILE IS A LOCK. `environment_torch28.yml` leaves ~45 transitive dependencies floating (a fresh resolve
# drifted click, starlette, pydantic & co. on 2026-10-12), which is fine for a default env but would put noise
# into a cu126-vs-cu128 comparison; so this twin pins them too (the block at the end), read from the live
# gen3ai_torch28 on 2026-10-12. `src/env_files_test.py` pins the twin's consistency with the main file: every
# pin of environment_torch28.yml appears here at the same version except the CUDA-build family.
#
# DELIBERATELY ABSENT (as in the main file): `poke-env`, and the PyPI `asyncio` backport (the live
# gen3ai_torch28 still carries asyncio 4.0.0 from its clone history — inert, but the shadowing hazard the main
# file's comment describes; this env does not).
#
# CUDA header packages: the 12.8.1 label of the nvidia channel (cuda-cccl 12.8.90, cuda-cudart-dev 12.8.90,
# cuda-crt-dev_linux-64 12.8.93) for AOTInductor's C++ build, as `agents.inference.service.aot.cuda_home()` uses.
# =====================================================================================
name: gen3ai_torch28_cu128
channels:
  - nvidia/label/cuda-12.8.1
  - defaults
dependencies:
  - python=3.11.15
  - pip=26.0.1
  # packaging + wheel are conda packages that float with the `defaults` channel (a fresh build got 26.3 / 0.47.0
  # where the shared env has 26.0 / 0.46.3): pinned so the PIP-visible package diff against gen3ai_torch28 is the
  # CUDA family alone. (The conda layer under python — ncurses, sqlite, xz, openssl, libgcc builds ... — is NOT
  # locked: it drifts with the channel by patch versions, touches no numeric path, and an old build pin would
  # make the file unsolvable the day the channel drops it. designs/ops/cloud_gpu_benchmark.md records the diff.)
  - packaging=26.0
  - wheel=0.46.3
  - cuda-cccl=12.8.90
  - cuda-cudart-dev=12.8.90
  - cuda-crt-dev_linux-64=12.8.93
  - pip:
      # the torch wheels are local-version (+cu128) builds: not on PyPI, only on this index
      - --extra-index-url https://download.pytorch.org/whl/cu128
