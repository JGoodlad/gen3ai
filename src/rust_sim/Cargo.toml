# pokesim — a from-scratch, bit-for-bit-faithful Rust reimplementation of the
# Pokémon Showdown battle simulator, scoped first to Gen 3 OU singles.
#
# Deliberately std-only: no dependencies. Bit-exact determinism is the whole
# point, so the RNG (ChaCha20 + the Gen5 LCG) is hand-rolled and auditable, and
# `cargo test` needs no network to fetch crates. Add deps only with a clear
# reason; never one that touches the deterministic battle path.

[package]
name = "pokesim"
version = "0.0.0"
edition = "2021"
description = "Bit-for-bit faithful Rust port of the Pokémon Showdown simulator (Gen 3 OU singles first)"
license = "MIT"
publish = false

[lib]
name = "pokesim"
path = "src/lib.rs"

[dependencies]
# none — std-only by design (see header).



[features]
# The EMISSION SELF-CHECK (`src/emission_check.rs`, `gen3_core_emission_selfcheck_v1`): every
# emitted line round-trips and every viewer's render is the line that viewer is owed, asserted at
# the moment of emission. ON in every `debug_assertions` build (so `cargo test`); this feature turns
# it on in an OPTIMIZED build for the fuzzers and the Python fuzz/parity surface. Production NEVER
# passes it: `cargo build --release` (what training's resolver builds) compiles every call out.
emission-selfcheck = []

# The optimized SELF-CHECK build: `cargo build --profile selfcheck --features emission-selfcheck`.
# Its own output directory (`target/selfcheck/`) is the point — a self-check build can never
# overwrite `target/release/`, the binaries a live training run execs.
[profile.selfcheck]
inherits = "release"
